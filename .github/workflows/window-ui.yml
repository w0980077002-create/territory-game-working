name: RPG windows · mobile layout and gameplay
on:
  pull_request:
    branches: [codex-build]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Arena image from a clean checkout
        run: bash scripts/qa/arena-container.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify online Arena on four mobile sizes
        run: |
          node --import tsx scripts/qa/fixtures.ts
          npm run arena:build
          node scripts/qa/online-arena.cjs
      - name: Verify Pages Arena, trade chat, guilds and Telegram save routes
        env:
          VITE_ARENA_API_ORIGIN: http://127.0.0.1:18793
          VITE_VVR_COMMUNITY_URL: http://127.0.0.1:18792/functions/v1/vvr-community
          VITE_WORLD_BOSS_URL: http://127.0.0.1:18794/functions/v1/vvr-world-boss
        run: |
          npm run build
          node_modules/.bin/vite preview --host 127.0.0.1 --port 18791 --strictPort &
          preview=$!
          trap 'kill "$preview" 2>/dev/null || true' EXIT
          for n in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18791/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node scripts/qa/w066-ui.cjs
          node scripts/qa/campaign-proof-ui.cjs
      - name: Build the W066 Arena and Campaign Edge Functions
        run: |
          npm run arena:edge:build
          npm run campaign:edge:build
      - name: Measure local PostgreSQL Arena queue and checkpoint recovery
        run: bash scripts/qa/arena-rpc-assessment.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-arena-build
          path: |
            .tmp/arena/
            .tmp/window-qa/online-arena/
          include-hidden-files: true
          if-no-files-found: error
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start isolated local game
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Verify campaign finale, trophy and one-time acknowledgment
        run: |
          node --import tsx scripts/qa/fixtures.ts
          BASE_URL=http://localhost:5173/ node scripts/qa/story-finale.cjs
      - name: Verify equipment navigation, loot decisions and harbor timers
        run: BASE_URL=http://localhost:5173/ node scripts/qa/useful-loot.cjs
      - run: npm run test:windows
      - name: Verify rewards, shop and subpanels on mobile
        run: |
          node --import tsx scripts/qa/fixtures.ts
          BASE_URL=http://localhost:5173/ node scripts/qa/ui-subpanels.cjs
      - name: Verify mobile HUD hit zones and routes
        run: BASE_URL=http://localhost:5173/ OUT=.tmp/window-qa/button-routes node scripts/qa/button-routes.cjs
      - name: Verify paid Lair survives defeat and mode changes
        run: BASE_URL=http://localhost:5173/ node scripts/qa/paid-lair.cjs
      - name: Verify Dark Realm portal taps resume after reload
        run: BASE_URL=http://localhost:5173/ node scripts/qa/realm-portal-resume.cjs
      - name: Verify transactional healing, chapter rewards and Blessing
        run: BASE_URL=http://localhost:5173/ node scripts/qa/solo-stability.cjs
      - name: Verify economy progression and Hammer receipts
        run: BASE_URL=http://localhost:5173/ node scripts/qa/economy-progress.cjs
      - name: Verify carnival window on mobile
        run: BASE_URL=http://localhost:5173/ OUT=.tmp/window-qa/carnival node scripts/qa/carnival-ui.cjs
      - name: Verify hero, backpack and salvage protection
        run: BASE_URL=http://localhost:5173/ node scripts/qa/solo11-ui.cjs
      - name: Verify companion stars guide on old saves
        run: BASE_URL=http://localhost:5173/ OUT=.tmp/window-qa/companion-stars node scripts/qa/companion-stars.cjs
      - name: Verify Telegram fullscreen and safe areas
        run: BASE_URL=http://localhost:5173/ node scripts/qa/telegram-fullscreen.cjs
      - name: Verify Telegram save and restore
        run: BASE_URL=http://localhost:5173/ node scripts/qa/telegram-save.cjs
      - name: Verify large Telegram saves, failed uploads and manual backup
        run: |
          node --import tsx scripts/qa/fixtures.ts
          BASE_URL=http://localhost:5173/ node scripts/qa/cloud-size.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-window-screenshots
          path: .tmp/window-qa/
