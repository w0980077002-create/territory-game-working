name: Shared-game assets and docs integrity

on:
  push:
    branches: [main, codex-build]
    paths:
      - 'AGENTS.md'
      - 'ARCHITECTURE.md'
      - 'DEVELOPMENT_WORKFLOW.md'
      - '.codex/agents/critic.toml'
      - 'PROJECT_BRIEF.md'
      - 'README.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - 'config/**'
      - 'assets/characters/**'
      - 'assets/references/**'
      - 'scripts/validate_handoff.py'
      - '.github/workflows/preflight.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'ARCHITECTURE.md'
      - 'DEVELOPMENT_WORKFLOW.md'
      - '.codex/agents/critic.toml'
      - 'PROJECT_BRIEF.md'
      - 'README.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - 'config/**'
      - 'assets/characters/**'
      - 'assets/references/**'
      - 'scripts/validate_handoff.py'
      - '.github/workflows/preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate changed materials (full check if base unavailable)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python3 scripts/validate_handoff.py --base "$BASE_SHA"
