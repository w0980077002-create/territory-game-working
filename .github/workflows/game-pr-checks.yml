name: Game PR checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/game-pr-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
