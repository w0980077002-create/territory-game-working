name: Codex playable game · Pages
on:
  push:
    branches: [codex-build]
    paths: ['src/**', 'public/**', 'config/**', 'package*.json', 'tsconfig.json', 'vite.config.ts', 'index.html', 'tests/**', '.github/workflows/codex-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: codex-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/codex-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_ARENA_API_ORIGIN: https://vvr-arena-test-staging.up.railway.app
          VITE_VVR_COMMUNITY_URL: ${{ vars.VVR_COMMUNITY_URL || 'https://cemifozgxyhnbknsexzt.supabase.co/functions/v1/vvr-community' }}
          VITE_WORLD_BOSS_URL: ${{ vars.VVR_WORLD_BOSS_URL || 'https://cemifozgxyhnbknsexzt.supabase.co/functions/v1/vvr-world-boss' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: codex-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
  # The session that develops the game cannot reach these hosts; GitHub's runner checks them after every release.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/qa
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: built
      - run: tar -xf built/artifact.tar -C built
      - name: Published page serves this build
        run: scripts/qa/live-pages.sh "${{ needs.deploy.outputs.page_url }}" built
      - name: Live W066 functions answer with the deployed contract
        run: scripts/qa/live-functions.sh
