name: World boss · SQL on PostgreSQL
on:
  pull_request:
    branches: [codex-build]
    paths: ['supabase/**', 'tests/pg/worldBoss.test.ts', 'scripts/qa/world-boss-pg.sh', 'src/worldBoss/**', '.github/workflows/world-boss.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: World boss migration, concurrency, last hit and one-time rewards (scratch cluster)
        run: bash scripts/qa/world-boss-pg.sh
